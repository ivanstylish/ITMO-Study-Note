<!doctype html><html lang="zh"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f8f6;color:#232621;font:13px/1.7 Arial,sans-serif}h1{font-size:20px;line-height:1.4;margin:0 0 16px}p{margin:10px 0}button{width:100%;min-height:42px;border:1px solid #d8ddd3;border-radius:11px;background:white;color:inherit;font:inherit;cursor:pointer;margin:5px 0}button.primary{background:#232621;border-color:#232621;color:white}button:focus-visible{outline:2px solid #34745c;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.note{font-size:11px;color:#596054}.themes{display:flex;gap:6px;margin:12px 0}.themes span{flex:1;padding:10px 6px;border-radius:9px;font-size:11px;text-align:center;background:#d1fca6}.themes span:nth-child(2){background:#e8e3d5}.themes span:nth-child(3){background:#e1dcf7}pre{white-space:pre-wrap;font:11px/1.6 Arial;background:white;border-radius:10px;padding:12px;max-height:150px;overflow:auto}
</style><h1>第四阶段 · 对齐与边框修复</h1><p>作用于当前页面。保留原有内容、组件和原型连线。</p><button data-action="audit">检查当前页</button><button class="primary" data-action="repair">修复列对齐与圆角外框</button><p class="note">将完整的四边矩形边框换成原生描边，并对齐文件名、大小与操作列。单边分隔线和透明点击区域会保留。</p><div class="themes"><span>A 花园档案</span><span>B 纸本研究</span><span>C 星图工作台</span></div><button data-action="compare">生成三个可编辑、可切换的配色比较稿</button><p class="note">基于选中的完整画面；未选择时使用第 01 屏。比较稿在新页面，Present 中点击 A/B/C 切换。配色比较不等于完整主题系统。</p><pre id="status" aria-live="polite">尚未运行。当前工具不处理 Code Layer 内部页面。</pre><script>
const buttons=[...document.querySelectorAll('button')],status=document.querySelector('#status');
for(const button of buttons)button.onclick=()=>{buttons.forEach(b=>b.disabled=true);status.textContent='正在执行…';parent.postMessage({pluginMessage:{type:button.dataset.action}},'*')};
window.onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;buttons.forEach(b=>b.disabled=false);if(m.type==='error'){status.textContent=m.message;return}const r=m.result;status.textContent=r.screens?'已生成 3 个原生可编辑比较稿，9 条配色切换连线。\n'+r.note:r.after?'已替换边框：'+r.borders+'\n已对齐文件行：'+r.rows+'\n当前原型反应数：'+r.after.prototypeTargets:'可编辑按钮/主组件：'+r.editableButtons+'\n可替换四边框：'+r.borderCandidates+'\n文件行：'+r.fileRows+'\n当前原型反应数：'+r.prototypeTargets;};
</script></html>

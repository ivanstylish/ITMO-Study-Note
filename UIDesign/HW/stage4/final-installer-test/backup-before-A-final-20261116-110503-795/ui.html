<!doctype html><html lang="zh"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:25px;background:#f7f8f6;color:#232621;font:14px/1.7 'Segoe UI',Arial,sans-serif}h1{font-size:22px;line-height:1.35;margin:0 0 18px}p{margin:12px 0}.sample{padding:17px 19px;background:#fff;border:1px solid #dfe5d9;border-radius:14px;font-size:17px;font-weight:600}.sample small{display:block;font-size:12px;font-weight:400;margin-top:6px;color:#596650}button{width:100%;min-height:46px;border:1px solid #232621;border-radius:11px;color:white;background:#232621;font:600 14px 'Segoe UI',Arial,sans-serif;margin-top:18px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.note{font-size:12px;color:#596650}#status{white-space:pre-wrap;font-size:12px;max-height:160px;overflow:auto}button:focus-visible{outline:2px solid #34745c;outline-offset:3px}</style><h1>Knowledge Agent<br>A · 花园档案 · Present 交互修订版</h1><div class="sample">Знания остаются с нами.<small>Segoe UI · 正文 / Semibold · 按钮与强调</small></div><p>生成 81 个主状态与 10 个图谱缩放状态。原生文字、矢量、描边、组件和原型连接均可编辑。</p><p class="note">会新建页面，保留现有原型。完成后使用 Figma 右上角 Present 播放；画布中的点击用于编辑图层。</p><button id="run" disabled>检查本机字体中…</button><button id="patch" disabled style="background:#34745c;border-color:#34745c">为当前页补上交互（不重新生成）</button><p id="status" aria-live="polite"></p><p class="note">完整网页交互另见 web-source/index.html。Figma 原型中的搜索与文本输入为展示状态；文件、模型和 Obsidian 使用模拟数据。</p><script>const run=document.getElementById('run'),status=document.getElementById('status');run.onclick=()=>{run.disabled=true;status.textContent='正在生成，请保留插件窗口…';parent.postMessage({pluginMessage:{type:'import'}},'*')};window.onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='ready'){run.disabled=!!m.missing.length;run.textContent=m.missing.length?'缺少字体':'生成完整可编辑交互原型';status.textContent=m.missing.length?'Figma 尚未识别：'+m.missing.join('、')+'。请使用桌面版或启用本地字体。':'已识别：'+m.fonts.join('、')}if(m.type==='progress')status.textContent=m.text;if(m.type==='done'){status.textContent='已生成 '+m.mainScreens+' 个主状态 + '+(m.screens-m.mainScreens)+' 个缩放状态。\n'+m.links+' 条点击连接，'+m.timers+' 条定时跳转。\n图片层：'+m.imageLayers+'；未连接操作：'+m.unresolved.length+'。\n请在 Present 中验证关键流程。';run.textContent='再生成一份';run.disabled=false}if(m.type==='error'){status.textContent=m.text;run.disabled=false;run.textContent='重新生成'}};</script></html>
<script>const patchButton=document.getElementById('patch');patchButton.onclick=()=>{patchButton.disabled=true;document.getElementById('status').textContent='正在为当前页补交互…';parent.postMessage({pluginMessage:{type:'patch'}},'*')};window.addEventListener('message',e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='ready')patchButton.disabled=!!m.missing.length;if(m.type==='patched'){patchButton.disabled=false;document.getElementById('status').textContent='已补 '+m.links+' 个点击区域、'+m.settings+' 个设置字段。请关闭旧 Present 预览，再从选中的第 01 屏重新 Present。'}if(m.type==='error')patchButton.disabled=false});</script>

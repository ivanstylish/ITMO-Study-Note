<!doctype html><html lang="zh"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:24px;font:12px/1.8 Arial,sans-serif;color:#283d30;background:#f7f9f3}h1{font-size:19px;line-height:1.4;margin:0 0 14px}.sample{background:#244e3d;color:#f4f6e9;padding:15px 18px;border-radius:9px;font:26px/1.05 Georgia,serif;margin-bottom:20px}.sample span{color:#cbf7a0}p{margin:12px 0;color:#71816a}.font{border-top:1px solid #dfe7d8;padding:9px 0}.font span{float:right;color:#668550}a{color:#477647}button{border:0;border-radius:9px;padding:12px 18px;width:100%;font:12px Arial;background:#244e3d;color:#fff;cursor:pointer;margin-top:16px}button:disabled{opacity:.4}label{display:block;margin-top:15px}select{width:100%;padding:9px;border:1px solid #d8e1cf;border-radius:7px;background:white;color:#344a2f}#status{color:#6c7f5d;font-size:11px;white-space:pre-wrap}small{font-size:10px;color:#8b977f}</style><h1>Knowledge Agent · 可编辑页面</h1><div class="sample">KNOWLEDGE<br><span>AGENT</span></div><div id="fonts">正在检查本机字体…</div><label>导入范围<select id="scope"><option value="all">全部 81 个状态与点击连线</option></select></label><p>生成后点击 Figma 右上角 Present / 播放按钮测试导航。搜索、自由拖动与缩放请使用文件中的代码图层。</p><small>Delight 不含俄文字形，俄文使用 Manrope。Delight 未安装时，英文暂用 Manrope；安装后重新运行即可。</small><div><a href="https://www.behance.net/gallery/219085487/Delight-Typeface-Free-09-Weights-Variable" target="_blank">Delight 作者与获取地址 ↗</a></div><button id="run" disabled>生成可编辑画面</button><p id="status"></p><script>const run=document.querySelector('#run');run.onclick=()=>{run.disabled=true;parent.postMessage({pluginMessage:{type:'import',scope:document.querySelector('#scope').value}},'*')};window.onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='fonts'){document.querySelector('#fonts').innerHTML=m.fonts.map(f=>'<div class="font">'+f.name+'<span>'+(f.available?'可用':'未安装')+'</span></div>').join('');run.disabled=!m.ready;if(!m.ready)document.querySelector('#status').textContent='请先安装 fonts 文件夹里的 Manrope 与 Bodoni Moda，重启 Figma 后运行。'}if(m.type==='progress')document.querySelector('#status').textContent=m.text;if(m.type==='done'){document.querySelector('#status').textContent='完成：'+m.screens+' 个画面，'+m.links+' 条点击连线。\n点击 Figma 右上角 Present / 播放按钮测试交互。';run.textContent='再生成一份';run.disabled=false}if(m.type==='error'){document.querySelector('#status').textContent=m.text;run.disabled=false}};</script></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Agent</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><div id="reviewbar"></div><dialog id="screen-picker"><div class="picker-head"><h2>Все экраны <span>81</span></h2><button class="icon-button" onclick="this.closest('dialog').close()" aria-label="Закрыть">×</button></div><input id="screen-search" placeholder="Найти экран…" oninput="drawPicker(this.value)"><div id="screen-list"></div></dialog><script src="data.js"></script><script src="app.js"></script><script src="final.js"></script><script src="../capture-dom.js"></script><script>
window.addEventListener('load',async()=>{
 await document.fonts.ready;
 const scenes=[],audits=[];
 for(const m of SCREENS){go(m.id);const scene=captureCurrent();scenes.push({id:m.id,name:m.title,...scene});audits.push({id:m.id,overflows:scene.overflows,clippedText:scene.clippedText,font:scene.bodyFont});}
 const zoomIds={};let next=82;
 for(const id of [44,45,46,47,48])for(const delta of [-.2,.2]){go(id);graphZoom(delta);const scene=captureCurrent();const extra=next++;zoomIds[id+':'+(delta<0?'out':'in')]=extra;scenes.push({id:extra,name:SCREENS[id-1].title+' · '+(delta<0?'80%':'120%'),source:id,...scene});}
 for(const scene of scenes){const id=scene.source||scene.id;if(id>=44&&id<=48)for(const tool of scene.graphTools){let to=id;if(tool.label==='Уменьшить')to=scene.source&&scene.name.includes('120%')?id:zoomIds[id+':out'];if(tool.label==='Увеличить')to=scene.source&&scene.name.includes('80%')?id:zoomIds[id+':in'];scene.actions.push({...tool,to})}}
 const checks=[];for(const pair of [[0,5],[1,12],[2,24],[3,19],[4,20],[5,21]]){go(2);document.querySelectorAll('.file-option .btn')[pair[0]].click();checks.push(['file-route-'+pair[0],current===pair[1]]);}go(21);document.querySelector('.actions .primary').click();checks.push(['attention-conflict-plan',current===27]);go(1);document.querySelector('.dropzone .btn').click();checks.push(['choose-file',current===2]);document.querySelector('.file-option .btn').click();checks.push(['open-file',current===5]);document.querySelector('.actions .primary').click();checks.push(['analyze',current===9]);go(7);document.querySelector('.check').click();checks.push(['empty-plan',current===11&&document.querySelector('.actions .primary').disabled]);go(14);document.querySelectorAll('.check')[1].click();checks.push(['single-note',current===68]);go(33);document.querySelector('.actions .btn').click();checks.push(['conflict-back',current===27]);go(4);document.querySelector('.actions .primary').click();checks.push(['clipboard-route',current===59]);go(42);document.querySelector('.actions .btn').click();checks.push(['restore-cancel',current===41]);go(6);const select=document.querySelector('[data-model-selector]');select.value='Claude Sonnet';select.dispatchEvent(new Event('change'));checks.push(['model-selector',selectedModel==='Claude Sonnet']);go(38);const search=document.querySelector('#history-search');search.value='RAG';search.dispatchEvent(new Event('input'));checks.push(['history-search',[...document.querySelectorAll('#history-rows tr')].filter(r=>!r.hidden).length===1]);
 const output=document.createElement('script');output.id='scene-data';output.type='application/json';output.textContent=JSON.stringify({scenes,checks,audits});document.body.appendChild(output);
});
</script></body></html>

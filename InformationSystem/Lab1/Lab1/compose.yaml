services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: city_lab1
      POSTGRES_USER: city_app
      POSTGRES_PASSWORD: city_local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - city_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city_app -d city_lab1"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  city_data:

